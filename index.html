<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Fretboard Atlas</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@400;500;600&family=Instrument+Sans:wght@400;500;600;700&display=swap" rel="stylesheet" />
  <style>
    :root {
      --bg: #121416;
      --bg-elev: #1a1d21;
      --bg-panel: #22262b;
      --line: #2e343c;
      --text: #e8eaed;
      --muted: #8b939e;
      --silver: #c5cbd3;
      --root: #e05a4f;
      --scale: #3dbe8c;
      --focus: #f0c14b;
      --playing: #6ea8ff;
      --wood-dark: #3a2a1e;
      --wood: #5c4330;
      --fret: #c9c4b8;
      --string: #b8b3a8;
      --inlay: #d8d2c4;
    }
    * { box-sizing: border-box; margin: 0; padding: 0; }
    html, body { height: 100%; }
    body {
      font-family: "Instrument Sans", system-ui, sans-serif;
      background: var(--bg);
      color: var(--text);
      display: flex;
      flex-direction: column;
      min-height: 100vh;
    }
    header {
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: 14px 22px;
      border-bottom: 1px solid var(--line);
      background: var(--bg-elev);
    }
    .brand {
      display: flex;
      align-items: baseline;
      gap: 12px;
    }
    .brand h1 {
      font-size: 18px;
      font-weight: 650;
      letter-spacing: 0.04em;
    }
    .brand span { color: var(--muted); font-size: 12px; font-family: "IBM Plex Mono", monospace; }
    .controls {
      display: flex;
      flex-wrap: wrap;
      gap: 10px 16px;
      align-items: end;
    }
    label {
      display: flex;
      flex-direction: column;
      gap: 4px;
      font-size: 11px;
      color: var(--muted);
      letter-spacing: 0.06em;
      text-transform: uppercase;
    }
    select, button {
      font-family: inherit;
      background: var(--bg-panel);
      color: var(--text);
      border: 1px solid var(--line);
      border-radius: 8px;
      padding: 7px 10px;
      font-size: 13px;
    }
    select:focus, button:focus { outline: 1px solid var(--playing); }
    button { cursor: pointer; }
    button.active { background: #2b3340; border-color: #4a6a94; color: var(--playing); }
    main {
      flex: 1;
      display: grid;
      grid-template-columns: 1fr 320px;
      gap: 16px;
      padding: 16px 22px 22px;
    }
    .board-wrap {
      background: var(--bg-elev);
      border: 1px solid var(--line);
      border-radius: 14px;
      padding: 16px;
      overflow: auto;
    }
    .legend {
      display: flex;
      gap: 16px;
      margin-bottom: 12px;
      font-size: 12px;
      color: var(--muted);
    }
    .swatch {
      width: 10px; height: 10px; border-radius: 50%; display: inline-block; margin-right: 6px; vertical-align: middle;
    }
    .fretboard {
      position: relative;
      min-width: 980px;
    }
    .nut-row, .fret-numbers {
      display: grid;
      grid-template-columns: 36px repeat(var(--cols, 15), 1fr);
      margin-bottom: 6px;
      font-family: "IBM Plex Mono", monospace;
      font-size: 11px;
      color: var(--muted);
      text-align: center;
    }
    .strings {
      display: flex;
      flex-direction: column;
      gap: 0;
      background: linear-gradient(180deg, #2a2118, #4a3626 40%, #2c2118);
      border-radius: 4px 12px 12px 4px;
      border: 1px solid #1a140e;
      overflow: hidden;
    }
    .string-row {
      display: grid;
      grid-template-columns: 36px repeat(var(--cols, 15), 1fr);
      height: 42px;
      position: relative;
    }
    .string-row::after {
      content: "";
      position: absolute;
      left: 36px; right: 0; top: 50%;
      height: var(--sw);
      background: linear-gradient(90deg, #eee, #9a958c);
      transform: translateY(-50%);
      pointer-events: none;
      opacity: 0.55;
    }
    .open, .cell {
      position: relative;
      z-index: 2;
      display: flex;
      align-items: center;
      justify-content: center;
      border-right: 2px solid var(--fret);
    }
    .open {
      border-right: 6px solid #efe6d6;
      background: #1c1f23;
      color: var(--muted);
      font-family: "IBM Plex Mono", monospace;
      font-size: 11px;
    }
    .cell { cursor: default; }
    .dot {
      width: 26px; height: 26px;
      border-radius: 50%;
      display: flex; align-items: center; justify-content: center;
      font-size: 10px;
      font-family: "IBM Plex Mono", monospace;
      font-weight: 600;
      color: #111;
      box-shadow: 0 1px 3px rgba(0,0,0,.45);
    }
    .dot.root { background: var(--root); color: #fff; }
    .dot.scale { background: var(--scale); }
    .dot.focus { background: var(--focus); }
    .dot.playing { box-shadow: 0 0 0 2px var(--playing), 0 1px 3px rgba(0,0,0,.45); }
    .inlays {
      position: absolute;
      left: 36px; right: 0; top: 0; bottom: 0;
      display: grid;
      grid-template-columns: repeat(var(--cols, 15), 1fr);
      pointer-events: none;
      z-index: 1;
    }
    .inlay { display: flex; align-items: center; justify-content: center; }
    .inlay span {
      width: 9px; height: 9px; border-radius: 50%;
      background: var(--inlay); opacity: 0.28;
    }
    .inlay.double { flex-direction: column; gap: 48px; }
    aside {
      display: flex;
      flex-direction: column;
      gap: 12px;
    }
    .card {
      background: var(--bg-elev);
      border: 1px solid var(--line);
      border-radius: 14px;
      padding: 14px;
    }
    .card h2 {
      font-size: 12px;
      letter-spacing: 0.08em;
      text-transform: uppercase;
      color: var(--muted);
      margin-bottom: 10px;
    }
    .degrees {
      display: flex;
      flex-wrap: wrap;
      gap: 6px;
    }
    .deg {
      border: 1px solid var(--line);
      background: var(--bg-panel);
      color: var(--text);
      border-radius: 999px;
      padding: 5px 9px;
      font-size: 12px;
      font-family: "IBM Plex Mono", monospace;
      cursor: pointer;
    }
    .deg.on { background: #3a3420; border-color: #8a7428; color: var(--focus); }
    .formula { font-family: "IBM Plex Mono", monospace; font-size: 13px; color: #d4d8de; margin-bottom: 8px; }
    .notes-row { font-size: 14px; margin-bottom: 4px; }
    .hint { font-size: 12px; color: var(--muted); line-height: 1.45; }
    .chords { display: flex; flex-direction: column; gap: 8px; max-height: 360px; overflow: auto; }
    .chord {
      display: grid;
      grid-template-columns: 92px 1fr;
      gap: 8px;
      font-size: 13px;
      padding: 8px;
      border-radius: 8px;
      background: var(--bg-panel);
      border: 1px solid transparent;
      cursor: pointer;
    }
    .chord:hover, .chord.sel { border-color: #4a6a94; }
    .chord b { font-weight: 600; }
    .chord span { color: var(--muted); font-family: "IBM Plex Mono", monospace; font-size: 12px; }
    footer {
      padding: 8px 22px 14px;
      color: var(--muted);
      font-size: 11px;
    }
    @media (max-width: 980px) {
      main { grid-template-columns: 1fr; }
    }
  </style>
</head>
<body>
  <header>
    <div class="brand">
      <h1>Fretboard Atlas</h1>
      <span>scales · tones · chords</span>
    </div>
    <div class="controls">
      <label>Playing over
        <select id="playKey"></select>
      </label>
      <label>Scale key
        <select id="scaleKey"></select>
      </label>
      <label>Scale
        <select id="scaleType"></select>
      </label>
      <label>Frets
        <select id="fretCount">
          <option value="12">12</option>
          <option value="15" selected>15</option>
          <option value="17">17</option>
          <option value="21">21</option>
        </select>
      </label>
      <label>&nbsp;
        <button id="linkKeys" class="active" title="Keep scale key locked to playing-over key">Link keys</button>
      </label>
    </div>
  </header>

  <main>
    <section class="board-wrap">
      <div class="legend">
        <div><i class="swatch" style="background:var(--root)"></i>Root</div>
        <div><i class="swatch" style="background:var(--scale)"></i>Scale tone</div>
        <div><i class="swatch" style="background:var(--focus)"></i>Focus degree</div>
        <div><i class="swatch" style="background:var(--playing)"></i>Playing-over root</div>
      </div>
      <div class="fretboard" id="board"></div>
    </section>

    <aside>
      <div class="card">
        <h2>This scale</h2>
        <div class="formula" id="formula"></div>
        <div class="notes-row" id="scaleNotes"></div>
        <p class="hint" id="scaleHint"></p>
      </div>
      <div class="card">
        <h2>Focus degrees</h2>
        <div class="degrees" id="degrees"></div>
        <p class="hint" style="margin-top:8px">Click degrees to highlight target notes on the neck. Roots stay red.</p>
      </div>
      <div class="card">
        <h2>Chord types in this key</h2>
        <div class="chords" id="chords"></div>
      </div>
    </aside>
  </main>
  <footer>Standard tuning · notes wrap at the octave · dark graphite UI</footer>

  <script>
    const NOTES = ["C","C#","D","D#","E","F","F#","G","G#","A","A#","B"];
    const OPEN = [4, 11, 7, 2, 9, 4]; // E A D G B E as pitch class from C=0
    const STRING_NAMES = ["E","B","G","D","A","E"];
    const STRING_WEIGHTS = ["1px","1.2px","1.5px","2px","2.4px","2.8px"];

    const SCALES = {
      "Major (Ionian)":        { iv: [0,2,4,5,7,9,11], hint: "Bright, resolved. I–ii–iii–IV–V–vi–vii°" },
      "Natural minor (Aeolian)": { iv: [0,2,3,5,7,8,10], hint: "Dark, relative minor of the major 3 semitones up." },
      "Harmonic minor":        { iv: [0,2,3,5,7,8,11], hint: "Raised 7th. Strong V7 pull. Spanish / classical color." },
      "Melodic minor":         { iv: [0,2,3,5,7,9,11], hint: "Jazz minor. Raised 6 and 7 ascending." },
      "Dorian":                { iv: [0,2,3,5,7,9,10], hint: "Minor with a raised 6. Funky / modal rock." },
      "Phrygian":              { iv: [0,1,3,5,7,8,10], hint: "Flat 2. Spanish / metal flavor." },
      "Lydian":                { iv: [0,2,4,6,7,9,11], hint: "Sharp 4. Dreamy, floating major." },
      "Mixolydian":            { iv: [0,2,4,5,7,9,10], hint: "Dominant / blues-rock major with flat 7." },
      "Locrian":               { iv: [0,1,3,5,6,8,10], hint: "Diminished tonic. Unstable, rarely tonal home." },
      "Major pentatonic":      { iv: [0,2,4,7,9], hint: "1 2 3 5 6. Country, pop, safe major melody." },
      "Minor pentatonic":      { iv: [0,3,5,7,10], hint: "1 b3 4 5 b7. Default rock / blues box." },
      "Blues":                 { iv: [0,3,5,6,7,10], hint: "Minor pentatonic plus the blue note (b5)." },
      "Major blues":           { iv: [0,2,3,4,7,9], hint: "Major pentatonic plus #2 / b3." },
      "Whole tone":            { iv: [0,2,4,6,8,10], hint: "Augmented, dreamlike, no leading tone." },
      "Diminished (HW)":       { iv: [0,1,3,4,6,7,9,10], hint: "Half-whole. Dominant / diminished lines." },
      "Diminished (WH)":       { iv: [0,2,3,5,6,8,9,11], hint: "Whole-half. Diminished arpeggio highways." },
    };

    const DEGREE_NAMES = {
      0:"1", 1:"b2", 2:"2", 3:"b3", 4:"3", 5:"4", 6:"b5/#4", 7:"5", 8:"b6", 9:"6", 10:"b7", 11:"7"
    };

    const CHORD_TYPES = [
      { name: "Major",     iv: [0,4,7],        tag: "1 3 5" },
      { name: "Minor",     iv: [0,3,7],        tag: "1 b3 5" },
      { name: "Diminished",iv: [0,3,6],        tag: "1 b3 b5" },
      { name: "Augmented", iv: [0,4,8],        tag: "1 3 #5" },
      { name: "Sus2",      iv: [0,2,7],        tag: "1 2 5" },
      { name: "Sus4",      iv: [0,5,7],        tag: "1 4 5" },
      { name: "6",         iv: [0,4,7,9],      tag: "1 3 5 6" },
      { name: "m6",        iv: [0,3,7,9],      tag: "1 b3 5 6" },
      { name: "Maj7",      iv: [0,4,7,11],     tag: "1 3 5 7" },
      { name: "7",         iv: [0,4,7,10],     tag: "1 3 5 b7" },
      { name: "m7",        iv: [0,3,7,10],     tag: "1 b3 5 b7" },
      { name: "m7b5",      iv: [0,3,6,10],     tag: "1 b3 b5 b7" },
      { name: "dim7",      iv: [0,3,6,9],      tag: "1 b3 b5 bb7" },
      { name: "mMaj7",     iv: [0,3,7,11],     tag: "1 b3 5 7" },
      { name: "9",         iv: [0,4,7,10,2],   tag: "1 3 5 b7 9" },
      { name: "Maj9",      iv: [0,4,7,11,2],   tag: "1 3 5 7 9" },
      { name: "m9",        iv: [0,3,7,10,2],   tag: "1 b3 5 b7 9" },
      { name: "add9",      iv: [0,4,7,2],      tag: "1 3 5 9" },
      { name: "11",        iv: [0,4,7,10,2,5], tag: "1 3 5 b7 9 11" },
      { name: "13",        iv: [0,4,7,10,2,9], tag: "1 3 5 b7 9 13" },
    ];

    const state = {
      playKey: 9,      // A
      scaleKey: 9,     // A
      scale: "Natural minor (Aeolian)",
      frets: 15,
      focus: new Set(),
      link: true,
      chordFilter: null,
    };

    const $ = (id) => document.getElementById(id);

    function fillSelects() {
      NOTES.forEach((n, i) => {
        $("playKey").innerHTML += `<option value="${i}">${n}</option>`;
        $("scaleKey").innerHTML += `<option value="${i}">${n}</option>`;
      });
      Object.keys(SCALES).forEach((name) => {
        $("scaleType").innerHTML += `<option>${name}</option>`;
      });
      $("playKey").value = state.playKey;
      $("scaleKey").value = state.scaleKey;
      $("scaleType").value = state.scale;
    }

    function pcName(pc) { return NOTES[((pc % 12) + 12) % 12]; }

    function scalePCs() {
      const root = state.scaleKey;
      return SCALES[state.scale].iv.map((i) => (root + i) % 12);
    }

    function intervalFromRoot(pc) {
      return (pc - state.scaleKey + 12) % 12;
    }

    function renderDegrees() {
      const ivs = SCALES[state.scale].iv;
      $("degrees").innerHTML = ivs.map((iv) => {
        const on = state.focus.has(iv) ? "on" : "";
        return `<button class="deg ${on}" data-iv="${iv}">${DEGREE_NAMES[iv]} · ${pcName(state.scaleKey + iv)}</button>`;
      }).join("");
      $("degrees").querySelectorAll(".deg").forEach((btn) => {
        btn.onclick = () => {
          const iv = +btn.dataset.iv;
          if (state.focus.has(iv)) state.focus.delete(iv); else state.focus.add(iv);
          render();
        };
      });
    }

    function renderInfo() {
      const sc = SCALES[state.scale];
      const notes = sc.iv.map((i) => pcName(state.scaleKey + i));
      $("formula").textContent = sc.iv.map((i) => DEGREE_NAMES[i]).join("  ·  ");
      $("scaleNotes").textContent = notes.join("  –  ");
      $("scaleHint").textContent = sc.hint;
    }

    function chordInScale(chord) {
      const set = new Set(scalePCs());
      return chord.iv.every((i) => set.has((state.scaleKey + i) % 12));
    }

    function renderChords() {
      const rootName = pcName(state.scaleKey);
      $("chords").innerHTML = CHORD_TYPES.map((c, idx) => {
        const inScale = chordInScale(c);
        const tones = c.iv.map((i) => pcName(state.scaleKey + i)).join(" ");
        const sel = state.chordFilter === idx ? "sel" : "";
        const opacity = inScale ? 1 : 0.45;
        return `<div class="chord ${sel}" data-idx="${idx}" style="opacity:${opacity}">
          <b>${rootName}${c.name === "Major" ? "" : c.name === "Minor" ? "m" : c.name}</b>
          <span>${c.tag}<br>${tones}${inScale ? "" : " · outside"}</span>
        </div>`;
      }).join("");
      $("chords").querySelectorAll(".chord").forEach((el) => {
        el.onclick = () => {
          const idx = +el.dataset.idx;
          state.chordFilter = state.chordFilter === idx ? null : idx;
          render();
        };
      });
    }

    function noteClass(pc) {
      const iv = intervalFromRoot(pc);
      if (state.chordFilter != null) {
        const chord = CHORD_TYPES[state.chordFilter];
        const inChord = chord.iv.includes(iv);
        if (!inChord) return null;
        if (iv === 0) return "root";
        return state.focus.has(iv) ? "focus" : "scale";
      }
      const inScale = SCALES[state.scale].iv.includes(iv);
      if (!inScale) return null;
      if (iv === 0) return "root";
      if (state.focus.has(iv)) return "focus";
      return "scale";
    }

    function renderBoard() {
      const frets = state.frets;
      const inlayFrets = new Set([3,5,7,9,12,15,17,19,21]);
      let html = `<div class="fret-numbers" style="--cols:${frets}"><div></div>`;
      for (let f = 1; f <= frets; f++) html += `<div>${f}</div>`;
      html += `</div><div class="strings" style="position:relative;--cols:${frets}">`;
      html += `<div class="inlays">`;
      for (let f = 1; f <= frets; f++) {
        const dbl = f === 12 || f === 24;
        html += `<div class="inlay ${dbl ? "double" : ""}">${inlayFrets.has(f) ? (dbl ? "<span></span><span></span>" : "<span></span>") : ""}</div>`;
      }
      html += `</div>`;

      OPEN.forEach((openPc, s) => {
        html += `<div class="string-row" style="--sw:${STRING_WEIGHTS[s]};--cols:${frets}">`;
        const openCls = noteClass(openPc);
        const playRing = openPc === state.playKey ? " playing" : "";
        html += `<div class="open">${openCls ? `<div class="dot ${openCls}${playRing}">${pcName(openPc)}</div>` : STRING_NAMES[s]}</div>`;
        for (let f = 1; f <= frets; f++) {
          const pc = (openPc + f) % 12;
          const cls = noteClass(pc);
          const ring = pc === state.playKey ? " playing" : "";
          html += `<div class="cell">${cls ? `<div class="dot ${cls}${ring}">${pcName(pc)}</div>` : ""}</div>`;
        }
        html += `</div>`;
      });
      html += `</div>`;
      $("board").innerHTML = html;
    }

    function render() {
      $("playKey").value = state.playKey;
      $("scaleKey").value = state.scaleKey;
      $("scaleType").value = state.scale;
      $("linkKeys").classList.toggle("active", state.link);
      renderInfo();
      renderDegrees();
      renderChords();
      renderBoard();
    }

    $("playKey").onchange = (e) => {
      state.playKey = +e.target.value;
      if (state.link) state.scaleKey = state.playKey;
      render();
    };
    $("scaleKey").onchange = (e) => {
      state.scaleKey = +e.target.value;
      state.link = false;
      render();
    };
    $("scaleType").onchange = (e) => {
      state.scale = e.target.value;
      state.focus = new Set();
      state.chordFilter = null;
      render();
    };
    $("fretCount").onchange = (e) => {
      state.frets = +e.target.value;
      render();
    };
    $("linkKeys").onclick = () => {
      state.link = !state.link;
      if (state.link) state.scaleKey = state.playKey;
      render();
    };

    fillSelects();
    render();
  </script>
</body>
</html>
